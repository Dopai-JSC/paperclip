# KC-04 B5/B6 (Dopaios) — bảo vệ test bằng CI (FR-29, tiêu chí 4 KC-04, QD-4):
# tác nhân sản xuất (namespace nhánh ai-prod/**) sửa/xóa/vô hiệu test hoặc CI
# thì check này đỏ.
#
# B6 (blocker review lens 2): dùng pull_request_target — workflow VÀ script
# chạy từ BẢN TIN CẬY trên nhánh base, không phải từ merge ref của PR; PR chỉ
# là DỮ LIỆU (hai SHA cho git diff), không dòng code nào của PR được thực
# thi. Nhờ đó một PR ai-prod/** không thể vừa sửa test vừa vô hiệu chính
# check này trong cùng PR. An toàn pull_request_target giữ được vì không
# checkout/execute code PR. Không filter branches (minor m-6): luật tự thoát
# sớm theo head branch, đích merge nào cũng được kiểm.
name: Dopai test protection

on:
  pull_request_target:

jobs:
  test-protection:
    runs-on: ubuntu-latest
    steps:
      # Mặc định của checkout dưới pull_request_target là NHÁNH BASE — đây
      # chính là điểm lấy bản tin cậy của script.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Unit test luật bảo vệ (bản tin cậy từ base)
        run: node --test scripts/check-test-protection.test.mjs
      - name: Lấy head của PR làm dữ liệu diff
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/kc04/pr-head"
      - name: Kiểm đường bảo vệ trên diff của PR
        run: |
          node scripts/check-test-protection.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.head.ref }}"
