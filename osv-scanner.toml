# Baseline chấp nhận rủi ro có kiểm soát cho gate osv-scanner (supply-chain.yml).
# Mọi mục ở đây là disposition đã được CTO duyệt, khớp hồ sơ 08 Bước nền
# (docs/architecture/verification/evidence/buoc-nen/08-chuoi-cung-ung.md, repo dopaios)
# và hồ sơ chuỗi cung ứng đợt 1. Advisory MỚI của các package KHÁC vẫn làm gate đỏ.
# Xem lại toàn bộ baseline khi đồng bộ upstream hoặc trước khi khóa kiến trúc.

# tar 6.2.1 — dependency bắc cầu; mọi bản vá nằm ở major 7.x (nhảy major 6→7).
# Disposition hồ sơ 08: không ép override để giữ hành vi tại tag v2026.707.0;
# xử lý khi upstream nâng hoặc khi KC liên quan đụng đường dùng tar.
[[PackageOverrides]]
name = "tar"
version = "6.2.1"
ecosystem = "npm"
ignore = true
reason = "Vá đòi nhảy major 6→7; giữ hành vi tại tag theo disposition hồ sơ 08 Bước nền; xem lại khi đồng bộ upstream."

# vite 7.3.1 — vite nội bộ do vitest 4.1.8 kéo theo, chỉ chạy trong dev/test-runner,
# không vào runtime; bản vite build UI đã ở 6.4.3 (đã vá). Override vite@^7.0.0 → 7.3.5
# đã khai trong package.json nhưng không khớp specifier khai báo của vitest
# (đúng ghi nhận của hồ sơ 08); xử lý đúng đắn là nâng vitest khi upstream nâng.
[[PackageOverrides]]
name = "vite"
version = "7.3.1"
ecosystem = "npm"
ignore = true
reason = "Vite nội bộ của vitest, chỉ dev/test-runner, không vào runtime; nâng vitest khi upstream nâng (disposition hồ sơ 08 Bước nền)."

# @anthropic-ai/sdk 0.81.0 — GHSA-p7fg-763f-g4gf (4.8), vá tại 0.91.1: nhảy nhiều
# minor 0.x trên đường tích hợp AI lõi của fork. Không bump ngoài KC: KC-02 sở hữu
# quyết định engine/adapter (đang đánh giá Agent SDK 0.3.220) — xử trong KC-02.
[[PackageOverrides]]
name = "@anthropic-ai/sdk"
version = "0.81.0"
ecosystem = "npm"
ignore = true
reason = "Vá đòi nhảy 0.81→0.91 trên đường tích hợp AI lõi; quyết định thuộc KC-02 (engine/adapter); xem lại khi KC-02 kết luận."

